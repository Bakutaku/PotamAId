name: Release Please

on:
  push:
    branches: [main]
  # jar の添付に失敗したリリースに、あとから jar を再添付するための手動実行
  workflow_dispatch:
    inputs:
      tag:
        description: 'jar を添付するリリースタグ（例: v0.1.0）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # main へのマージ内容からリリース PR を作成・更新する。
      # リリース PR がマージされた場合は、タグと GitHub Release を作成する。
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5

  # GITHUB_TOKEN で作成したタグやリリースは別のワークフローを起動しないため、
  # jar のビルドと添付はこのワークフロー内で行う。
  upload-jar:
    needs: release-please
    # 手動実行時は release-please ジョブがスキップされるため、!cancelled() で実行を続ける
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        working-directory: mod
    steps:
      # checkout 前なので、mod/ はまだ存在しない
      - name: Check release exists
        working-directory: ${{ github.workspace }}
        run: gh release view "$TAG" > /dev/null

      # リリースタグと同じコミットからビルドする
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

      # --clobber: 同名の jar が添付済みでも上書きして再試行できるようにする
      - name: Upload jar to GitHub Release
        run: gh release upload "$TAG" build/libs/*.jar --clobber
